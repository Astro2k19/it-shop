services:
  client:
    container_name: it-shop-client
    build:
      context: .
      dockerfile: ./apps/client/Dockerfile
    ports:
      - 4200:4200
    depends_on:
      - api
    develop:
      watch:
        - path: ./package.json
          action: rebuild
        - path: ./project.json
          action: rebuild
        - path: ./apps/client
          target: /src/apps/client
          action: sync
        - path: ./libs
          target: /libs
          action: sync

  api:
    container_name: it-shop-api
    build:
      context: .
      dockerfile: ./apps/api-migration/Dockerfile
    ports:
      - 3500:3500
    depends_on:
      - db
    develop:
      watch:
        - path: ./package.json
          action: rebuild
        - path: ./project.json
          action: rebuild
        - path: ./apps/api-migration
          target: /src/apps/api-migration
          action: sync
        - path: ./libs
          target: /libs
          action: sync

  db:
    container_name: it-shop-db
    build:
      context: .
      dockerfile: ./apps/mongo/Dockerfile
      args:
        MONGO_VERSION: 6
    environment:
      MONGO_REPLICA_HOST: db
      MONGO_REPLICA_PORT: 27017
      # Use "mongo" instead of "mongosh" before v5.0
      MONGO_COMMAND: 'mongosh'
    ports:
      - '27017:27017'
    restart: unless-stopped
    healthcheck:
      # Use "mongo" instead of "mongosh" before v5.0
      test: ['CMD', 'mongosh', 'admin', '--port', '27017', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 2s
      retries: 20

volumes:
  mongo:




